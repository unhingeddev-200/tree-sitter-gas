[package]
name = "tree-sitter-gas"
description = "grammar for gnu assembler"
version = "0.1.0"
authors = ["unhingeddev-200 <unhingeddev@proton.me>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "gas"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/unhingeddev-200/tree-sitter-gas.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
